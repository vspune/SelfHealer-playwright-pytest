[pytest]
testpaths = tests
pythonpath = .
addopts =
    -n 2
    --strict-markers
    --html=html-report/report.html
    --self-contained-html
    --alluredir=allure-results
    --clean-alluredir
    --tracing=retain-on-failure
log_level = INFO
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-7s %(name)s - %(message)s
log_date_format = %H:%M:%S
markers =
    smoke: quick critical checks (run on every push)
    regression: full regression suite
    p0: priority 0
    p1: priority 1
    p2: priority 2
    e2e: end-to-end flow
    role(name): user role the test logs in as, e.g. role("normal"); default is admin
    left_menu: left side menu checks
    login: Login module
    admin: Admin module
    pim: PIM module
    leave: Leave module
    time: Time module
    recruitment: Recruitment module
    my_info: My Info module
    performance: Performance module
    dashboard: Dashboard module
    directory: Directory module
    maintenance: Maintenance module
    claim: Claim module
    buzz: Buzz module
